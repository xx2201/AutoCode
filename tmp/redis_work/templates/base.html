<!doctype html>
<html lang="zh-CN">
<head>

  <title>{% block title %}Redis Session 演示{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <a href="{{ url_for('index') }}" class="brand">[Redis] Session 教学演示</a>
