{% extends "base.html" %}

{% block title %}403 禁止访问 - Redis Session 演示{% endblock %}

{% block content %}

<div class="card narrow">

  <h1>🚫 403 禁止访问</h1>

  <div class="alert">{{ message }}</div>

  <p class="muted">

    你已经登录, 但当前账号没有访问该资源的权限。

    如有疑问请联系管理员。

  </p>

  <div class="actions">

    <a class="btn" href="{{ url_for('home') }}">← 返回首页</a>

    <a class="btn danger" href="{{ url_for('logout') }}">换个账号</a>

  </div>

</div>

{% endblock %}
