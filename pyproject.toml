[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocode"
version = "0.3.0"
description = "AutoCode - Minimal AI coding agent (~1400 LoC) inspired by Claude Code. Works with any LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["autocode"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
telegram = ["python-telegram-bot>=22,<23"]
feishu = ["lark-oapi>=1.4,<2"]
dev = ["pytest>=7.0", "lark-oapi>=1.4,<2"]

[project.scripts]
autocode = "autocode.cli:main"
autocode-telegram = "autocode.remote.telegram_bot:main"
autocode-feishu = "autocode.remote.feishu_bot:main"

[project.urls]
Homepage = "https://github.com/he-yufeng/AutoCode"
Repository = "https://github.com/he-yufeng/AutoCode"
Issues = "https://github.com/he-yufeng/AutoCode/issues"

