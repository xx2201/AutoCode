[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocode"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jiahao Zheng", email = "zjhsczg@gmail.com" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "langfuse>=4.14.1,<5",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tavily-python>=0.7.26,<0.8",
    "Pillow>=12.1,<13",
    "pypdf>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["autocode"]

[tool.hatch.version]
path = "autocode/__init__.py"

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
telegram = ["python-telegram-bot>=22,<23"]
feishu = ["lark-oapi>=1.4,<2"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.27,<1"]
dev = ["pytest>=7.0", "lark-oapi>=1.4,<2", "httpx>=0.27,<1"]

[project.scripts]
autocode = "autocode.cli:main"
autocode-telegram = "autocode.remote.telegram_bot:main"
autocode-feishu = "autocode.remote.feishu_bot:main"
autocode-web = "autocode.web.__main__:main"
autocode-web-runner = "autocode.web.runner:main"

[project.urls]
Homepage = "https://github.com/he-yufeng/AutoCode"
Repository = "https://github.com/he-yufeng/AutoCode"
Issues = "https://github.com/he-yufeng/AutoCode/issues"

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
